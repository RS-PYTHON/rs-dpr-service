# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# The Dependabot proxy blocks the hosts that are not declared here (403 "egress not allowlisted").
# The EOPF GitLab hosts the eopf git dependency of pyproject.toml, that Dependabot must clone to update uv.lock.
registries:
  eopf-gitlab:
    type: git
    url: https://gitlab.eopf.copernicus.eu
    username: x-access-token
    password: ${{secrets.EOPF_GITLAB_TOKEN}}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Dependencies of pyproject.toml, locked in uv.lock: one pull request per update
  - package-ecosystem: "uv"
    directory: "/"
    registries:
      - eopf-gitlab
    schedule:
      interval: "daily"
    ignore:
      # The dask versions must be the same as in the dask cluster images of the processors, see rs-workflow-env
      - dependency-name: "dask"
      - dependency-name: "dask-gateway"
      - dependency-name: "distributed"
      # Same EOPF version as the processors, see rs-workflow-env
      - dependency-name: "eopf"
