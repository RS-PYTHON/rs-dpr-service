name: configure-deps
description: Configure dependency versions used by rs-dpr-service, to match versions used by processors.

inputs:
  create-temp-branches:
    description: Create temporary branches to save the specific poetry.lock files ?
outputs:
  matrix:
    description: >
      Matrix to be used by ci/cd workflows, something like:
      {
        "dep_name": ["py3.11.7-2024.5.2", "py3.13.12-2026.1.2", ...],
        "include": [
          {
            "dep_name": "py3.11.7-2024.5.2",
            "python_version": "3.11.7",
            "dask_version": "2024.5.2",
            "temp_branch": "true",
            "github_ref": "xxx",
            "github_ref_name": "yyy",
            "poetry_version": "zzz"
          },
          {
            "dep_name": "py3.13.12-2026.1.2",
            ...
          },
          ...
        ]
      }
    value: ${{ steps.configure.outputs.matrix }}

runs:
  using: "composite"
  steps:
    - id: configure
      name: Configure dependency versions
      env:
        # Current branch name (or source branch for a pull request)
        BRANCH_NAME: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.ref, github.ref_name) }}
        CREATE_TEMP_BRANCHES: ${{ inputs.create-temp-branches }}
      run: set -x; .github/actions/configure-deps/configure-deps.sh
      shell: bash
