name: Check code quality

on:
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
  pull_request:
    types: [opened, synchronize, reopened]
    # run this worflow only for code/test related changes (avoid it for documentation)
    paths: ['**.json', '**.lock', '**.py', '**.raw', '**.sh', '**.toml', '**.yaml', '**.yml']
  workflow_dispatch:

jobs:
  configure-deps:
    runs-on: ubuntu-latest
    name: Configure dependency versions
    permissions:
      contents: write # for the git push
    outputs:
      matrix: ${{ steps.configure-deps.outputs.matrix }}
      temp_matrix: ${{ steps.configure-deps.outputs.temp_matrix }}
      has_temp_branches: ${{ steps.configure-deps.outputs.has_temp_branches }}
      python_version: ${{ steps.configure-deps.outputs.python_version }}
      poetry_version: ${{ steps.configure-deps.outputs.poetry_version }}
    steps:
      - uses: actions/checkout@v6
      - id: configure-deps
        name: Configure dependency versions
        env:
          # Current branch name (or source branch for a pull request)
          BRANCH_NAME: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.ref, github.ref_name) }}
          CREATE_TEMP_BRANCHES: true
        run: set -x; .github/workflows/configure-deps.sh

  update-lock:
    name: Update lock files
    needs: configure-deps
    permissions:
      contents: write # for the git push
    uses: ./.github/workflows/update-lock.yml
    with:
      matrix: ${{ needs.configure-deps.outputs.matrix }}

  # All the code quality tools (pre-commit, license, Trivy, bandit, flake8, mypy, pylint, safety, pytest, SonarQube)
  # are run only once, on the current branch (or pull request).
  check-code-quality:
    name: Check code quality
    needs: configure-deps
    uses: RS-PYTHON/actions/.github/workflows/reusable-check-quality.yml@develop
    with:
      caller-repository: ${{ github.repository }}
      caller-ref: ${{ github.ref }}
      caller-ref_name: ${{ github.ref_name }}
      python-version: ${{ needs.configure-deps.outputs.python_version }}
      poetry-version: ${{ needs.configure-deps.outputs.poetry_version }}
      cov-dirs: rs_dpr_service
    secrets:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: write # for apache/skywalking-eyes/header
      pull-requests: write # for apache/skywalking-eyes/header and phwt/sonarqube-quality-gate-action

  # The temporary branches, with the other python and dask versions used by the processors, only run the pytests.
  # The Docker images of all the versions are built by the publish-binaries.yml workflow.
  run-pytests-temp-branches:
    runs-on: ubuntu-latest
    name: Run Pytest (${{ matrix.dep_name }})
    needs: [configure-deps, update-lock]
    if: ${{ needs.configure-deps.outputs.has_temp_branches == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure-deps.outputs.temp_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.github_ref }}

      - uses: RS-PYTHON/actions/.github/actions/setup-poetry@develop
        with:
          python-version: ${{ matrix.python_version }}
          poetry-version: ${{ matrix.poetry_version }}

      - name: Install and test
        run: |
          set -x
          poetry install --with dev
          poetry run -q opentelemetry-bootstrap -a install || true # install otel instrumentation packages for dependencies
          poetry run pip list

          # -ra: Show extra test summary info
          # --durations=N Show N slowest setup/test durations (N=0 for all)
          # --durations-min=N Minimal duration in seconds for inclusion in slowest list
          # --error-for-skips Treat skipped tests as errors
          poetry run pytest tests \
            -ra \
            --disable-pytest-warnings \
            --color=yes \
            --durations=0 \
            --durations-min=0.05 \
            --error-for-skips

  clean-temp-branches:
    name: Clean temporary branches
    needs: [configure-deps, update-lock, run-pytests-temp-branches]
    if: always() # even if crashed or cancelled
    permissions:
      contents: write # for the git branch delete
    uses: ./.github/workflows/clean-temp-branches.yml
    with:
      matrix: ${{ needs.configure-deps.outputs.matrix }}

  check-tasktables:
    runs-on: ubuntu-latest
    name: Check tasktables (json schema)
    steps:
      - uses: actions/checkout@v6
      - name: Validate tasktables
        run: |
          set -x
          for file in config/TaskTable_*.json; do
            schema=$(jq -r '."$schema"' "$file")
            schema=$(realpath "$(dirname "$file")/$schema")
            echo "Validating $file with schema $schema"
            pipx run check-jsonschema --schemafile "$schema" "$file"
          done
