name: Publish wheels and Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
  workflow_dispatch: # manual trigger
    inputs:
      add_docker_tags:
        description: Add these tags to the docker images as e.g. 'custom-tag1,custom-tag-2'
        required: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    outputs:
      version_name: ${{ steps.build-wheel.outputs.version_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # so that Dunamai produce the correct version

      # Modify pyproject.toml to remove constraints on python and dask versions
      - name: Remove version constraints
        run: |
          set -x

          # pyproject.toml contains the line: 'python = "==xxx"'
          # We change the python version to "*"
          sed -i "/^python[ \t=]/s/.*/python = \"*\"/g" pyproject.toml

          # pyproject.toml contains the line: 'dask = {extras = ["xxx"], version = "yyy"}'
          # We change the dask version to "*"
          sed -i "/^dask[ \t=]/s/version[^,}]*/version = \"*\"/g" pyproject.toml

          # The poetry.lock file should not be used when building the wheel
          rm poetry.lock

          # Display changes
          git diff pyproject.toml

      - id: build-wheel
        env:
          PYTHON_VERSION: 3 # generic python v3, we don't need a specific version
        uses: RS-PYTHON/actions/.github/actions/build-wheel@develop
        with:
          package_directory: .

  set-binary-env:
    name: Set Docker environment
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: build-wheel
    outputs:
      branch_name: ${{ steps.set-binary-env.outputs.branch_name }}
      docker_tags: ${{ steps.set-binary-env.outputs.docker_tags }}
      docker_final_tags: ${{ steps.set-binary-env.outputs.docker_final_tags }}
      debug_mode: ${{ steps.set-binary-env.outputs.debug_mode }}
    steps:
      - id: set-binary-env
        name: Call action 'set-binary-env'
        uses: RS-PYTHON/actions/.github/actions/set-binary-env@feat-rspy1108/jupyter-cicd
        with:
          wheel_version_name: ${{ needs.build-wheel.outputs.version_name }}
          add_docker_tags: ${{ inputs.add_docker_tags }}

  configure-deps:
    runs-on: ubuntu-latest
    name: Configure dependency versions
    outputs:
      matrix: ${{ steps.configure-deps.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: configure-deps
        name: Configure dependency versions
        env:
          # Current branch name (or source branch for a pull request)
          BRANCH_NAME: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.ref, github.ref_name) }}
          CREATE_TEMP_BRANCHES: false
        run: set -x; .github/workflows/configure-deps.sh

  publish-docker-images:
    name: "Build and publish Docker image"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    needs: [set-binary-env, configure-deps]
    permissions:
      security-events: write # needed for github/codeql-action/upload-sarif
      packages: write # needed for 'docker push'
    outputs:
      pushed_images: ${{ steps.publish-docker.outputs.docker_images }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure-deps.outputs.matrix) }} # coming from .github/actions/configure-deps/action.yml
    steps:
      - uses: actions/checkout@v6
      - name: Download .whl dependency
        uses: actions/download-artifact@v8
        with:
          pattern: rs_dpr_service-*.whl
          path: ./build_context_path
      - name: Copy Dockerfile requirements
        run: cp -t ./build_context_path ./.github/scripts/layer-cleanup.sh ./.github/scripts/restore-apt.sh

      - name: Handle debug mode
        env:
          DEBUG_MODE: ${{ needs.set-binary-env.outputs.debug_mode }}
          BRANCH_NAME: ${{ needs.set-binary-env.outputs.branch_name }}
          DOCKERFILE: ./.github/Dockerfile
        run: |
          set -x

          # Replace some parts of the Dockerfile depending on wether we're in debug mode or not.
          # It would be cleaner to use 'if' blocks in the Dockerfile but this doesn't exist...
          if [[ $DEBUG_MODE == true ]]; then
            cp -t ./build_context_path ./.github/scripts/git_debug_image.sh
            commands=$(cat << EOF
          USER root
          COPY ./git_debug_image.sh ./restore-apt.sh /usr/local/bin/
          # Use ';' not '&&' because they are not well handled by awk.
          RUN set -e; \
              cd /usr/local/bin/; \
              chmod u+x ./git_debug_image.sh ./restore-apt.sh; \
              ./git_debug_image.sh $BRANCH_NAME; \
              rm -f ./git_debug_image.sh ./restore-apt.sh
          WORKDIR /home/user/rs-dpr-service
          EOF
            )
            # Use awk instead of sed for multiline replace, see: https://stackoverflow.com/a/10107668
            awk -v r="$commands" '{gsub(/# \[DEBUG_MODE_COMMANDS\]/,r)}1' $DOCKERFILE > tmp
            mv tmp $DOCKERFILE
            sed -i "s@\[DEBUG_MODE_RELOAD\]@--reload@g" $DOCKERFILE

          # No debug mode: just remove these tags from the dockerfile
          else
            sed -i "s@# \[DEBUG_MODE_COMMANDS\]@@g" $DOCKERFILE
            sed -i "s@, \"\[DEBUG_MODE_RELOAD\]\"@@g" $DOCKERFILE
          fi
          cat $DOCKERFILE

      - run: ls ./build_context_path
      - id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@develop
        with:
          dockerfile: ./.github/Dockerfile
          build_context_path: ./build_context_path
          image_suffix: _${{ matrix.dep_name }}
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: |
            PYTHON_VERSION=${{ matrix.python_version }}
            DASK_VERSION=${{ matrix.dask_version }}

      - name: Check package versions in the docker image
        env:
          ALL_DOCKER_IMAGES: ${{ steps.publish-docker.outputs.docker_images }}
          PYTHON_VERSION: ${{ matrix.python_version }}
          DASK_VERSION: ${{ matrix.dask_version }}
        run: |
          set -x

          # NOTE: all docker images are identical but with different tags
          # so we could test only the first one...
          for image in ${ALL_DOCKER_IMAGES//,/ }; do
            docker_cmd="docker run --rm --entrypoint sh $image -c"
            show_python=$($docker_cmd "python -V")
            show_dask=$($docker_cmd "pip show dask")

            if [[ $(echo "$show_python" | awk '{ print $2 }') != $PYTHON_VERSION ]]; then
              echo "Wrong python version !" && exit 2
            fi
            if [[ $(echo "$show_dask" | awk '/Version/ { print $2 }') != $DASK_VERSION ]]; then
              echo "Wrong dask version !" && exit 2
            fi
          done

      - uses: cloudposse/github-action-matrix-outputs-write@81ea135d4c4f90a5220bb38304380073c571dbb8
        with:
          matrix-step-name: publish-docker-images
          matrix-key: ${{ matrix.dep_name }}
          outputs: |
            docker_images: ${{ steps.publish-docker.outputs.docker_images }}

  get-pushed-images:
    name: Get pushed Docker image names
    needs: [set-binary-env, publish-docker-images]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      pushed_images: ${{ steps.read.outputs.pushed_images }}
    steps:
      - id: read-matrix-outputs
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }} # only if a temp Docker tag has been set
        uses: cloudposse/github-action-matrix-outputs-read@ddb62566e896c85614f5eeec2daa43d6d1dc6cb0
        with:
            matrix-step-name: publish-docker-images
      - id: read
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }}
        run: |
          set -x
          # Docker images that have been pushed
          # e.g. {"docker_images": {"pyxxx-yyy": "<image1>", "pyxxx-zzz": "<image2>" }}
          json_images='${{ steps.read-matrix-outputs.outputs.result }}' # use simple quotes, not double quotes !
          pushed_images=$(echo "$json_images" | jq -r .docker_images[] | paste -sd,) # separate values with ','

          echo pushed_images="$pushed_images" >> "$GITHUB_OUTPUT"

  # Test rs-demo with the new Docker image
  test-demo:
    name: Test rs-demo
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [set-binary-env, publish-docker-images, get-pushed-images]
    permissions:
     packages: write # needed for 'docker push'
    steps:
      - name: Log into Docker registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test rs-demo
        env:
          BRANCH_NAME: ${{ needs.set-binary-env.outputs.branch_name }}
          DOCKER_TAGS: ${{ needs.set-binary-env.outputs.docker_tags }}
        run: |
          set -x

          # Keep last tag (after the last ',')
          export DOCKER_TAG=${DOCKER_TAGS##*,}

          # Clone the rs-demo repository
          git clone https://github.com/RS-PYTHON/rs-demo.git
          cd rs-demo

          # Run the rs-demo local mode using the newly created docker images
          ./test-rs-demo.sh

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-outputs
          path: local-mode/notebook-outputs/
          if-no-files-found: ignore

      # If we used a temp docker tag, and only if the tests succeeded, then
      # we tag the images with the real tags and push them.
      - name: Tag and push Docker images
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }}
        uses: RS-PYTHON/actions/.github/actions/tag-push-docker@develop
        with:
          old_docker_images: ${{ needs.get-pushed-images.outputs.pushed_images }}
          new_tags: ${{ needs.set-binary-env.outputs.docker_final_tags }}

  publish-wheels-pypi:
    name: "Publish wheels and sdists to PyPI"
    if: (github.actor != 'dependabot[bot]') && (github.event_name == 'push') && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [test-demo] # only if the tests succeeded
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download dist dependencies
        uses: actions/download-artifact@v8
        with:
          pattern: "*.{whl,tar.gz}"
          path: ./dist
          merge-multiple: true
      - name: Publish wheel and sdist packages
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true
          packages-dir: ./dist
          verbose: true
