name: Handle temporary branches

on:
  workflow_call: # reusable workflow
    inputs:
      matrix:
        description: Github matrix configuration coming from .github/actions/configure-deps/action.yml
        type: string

jobs:
  _:
    runs-on: ubuntu-latest
    env:
      MATRIX: ${{ inputs.matrix }}
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:

      - if: ${{ matrix.temp_branch == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.github_ref }}

      - if: ${{ matrix.temp_branch == 'true' }}
        uses: RS-PYTHON/actions/.github/actions/setup-poetry@develop
        with:
          python-version: ${{ matrix.python_version }}
          poetry-version: ${{ matrix.poetry_version }}

      - name: Update lock files
        if: ${{ matrix.temp_branch == 'true' }}
        env:
          DEP_NAME: ${{ matrix.dep_name }}
          TEMP_BRANCH_NAME: ${{ matrix.github_ref }}
        run: |
          set -x
          echo $MATRIX

          # Check that the branch name contains the TEMP substring
          if [[ ! "$TEMP_BRANCH_NAME" =~ TEMP ]]; then
            >&2 echo "Wrong temporary branch name: '$TEMP_BRANCH_NAME'"
            exit 2
          fi

          # Check environment
          python -V
          poetry -V
          grep -e python -e dask pyproject.toml

          # Update the poetry.lock file
          poetry lock
          git diff poetry.lock

          # Add it to the current temp branch
          git add poetry.lock
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Update poetry.lock for $DEP_NAME"
          git push
