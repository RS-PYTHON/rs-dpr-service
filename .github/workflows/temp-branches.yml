name: Handle temporary branches

on:
  workflow_call: # reusable workflow
    inputs:
      action:
        description: What to do ?
        type: string # update-lock or clean
      matrix:
        description: Github matrix configuration coming from .github/actions/configure-deps/action.yml
        type: string

jobs:
  _:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:

      - if: ${{ matrix.temp_branch == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.github_ref }}

      - name: Update lock files
        if: ${{ (inputs.action == 'update-lock') && (matrix.temp_branch == 'true') }}
        run: |
          set -x
          echo "${{ matrix.dep_name }}"
          echo "${{ matrix.python_version }}"
          echo "${{ matrix.dask_version }}"
          echo "${{ matrix.temp_branch }}"
          echo "${{ matrix.github_ref }}"
          echo "${{ matrix.github_ref_name }}"
          echo "${{ matrix.poetry_version }}"
          ls /crash

      - name: Clean temporary branches
        if: ${{ (inputs.action == 'clean') && (matrix.temp_branch == 'true') }}
        env:
          TEMP_BRANCH_NAME: ${{ matrix.github_ref }}
        run: |
          set -x;

          # Check that the branch name contains the TEMP substring
          # so we make sure we don't erase a valid branch
          if [[ ! "$TEMP_BRANCH_NAME" =~ TOTO ]]; then
            >&2 echo "Wrong temporary branch name: '$TEMP_BRANCH_NAME'"
            exit 2
          fi

          git push -d origin $TEMP_BRANCH_NAME
