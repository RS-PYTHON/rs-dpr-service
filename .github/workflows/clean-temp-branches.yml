name: Clean temporary branches

on:
  workflow_call: # reusable workflow
    inputs:
      matrix:
        description: Github matrix configuration coming from .github/actions/configure-deps/action.yml
        type: string

jobs:
  _:
    runs-on: ubuntu-latest
    env:
      MATRIX: ${{ inputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Clean temporary branches
        run: |
          set -x;
          echo $MATRIX | jq . # pretty-print the matrix

          # For each set of versions
          for dep in $(jq -c ".include[]" <<< $MATRIX); do
            temp_branch=$(jq -r '."temp_branch"' <<< $dep)
            github_ref=$(jq -r '."github_ref"' <<< $dep)

            [[ $temp_branch != true ]] && continue

            # Check that the branch name contains the TEMP substring
            if [[ ! "$github_ref" =~ TEMP ]]; then
              >&2 echo "Wrong temporary branch name: '$github_ref'"
              exit 2
            fi
            git push -d origin $github_ref
          done
